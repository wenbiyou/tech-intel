<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科技情报大屏 · tech-intel</title>
<style>
/* ═══════════════════════════════════════════
   TOKEN 体系（暗色精细 / 亮色自动适配）
   ═══════════════════════════════════════════ */
:root {
  --bg-deep:      #07090d;
  --bg:           #0b0e14;
  --bg-elevated:  #0f1219;
  --bg-card:      #131720;
  --bg-card-hover:#181d28;
  --border-subtle: rgba(255,255,255,.06);
  --border:       rgba(255,255,255,.10);
  --border-hover: rgba(255,255,255,.16);
  --text:         #e8ecf4;
  --text-secondary:#9aa3b8;
  --text-muted:   #5a6478;
  --accent:       #5b9cf6;
  --accent-glow:  rgba(91,156,246,.25);
  --star:         #f5c542;
  --star-glow:    rgba(245,197,66,.15);
  --star-border:  rgba(245,197,66,.30);
  --c-ai:      #5b9cf6;    --c-ai-bg:      rgba(91,156,246,.10);
  --c-robot:   #3dd68c;     --c-robot-bg:   rgba(61,214,140,.10);
  --c-industry:#c77dff;     --c-industry-bg:rgba(199,125,255,.10);
  --c-dev:     #38c6f8;     --c-dev-bg:     rgba(56,198,248,.10);
  --c-milpol:  #f06b6b;     --c-milpol-bg:  rgba(240,107,107,.10);
  --c-other:   #8b95a8;     --c-other-bg:   rgba(139,149,168,.08);
  --font-sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --r-sm: 6px;  --r-md: 12px;  --r-lg: 20px;  --r-xl: 28px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
  --shadow-md: 0 4px 16px rgba(0,0,0,.40), 0 1px 3px rgba(0,0,0,.25);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.30);
  --ease-out-expo: cubic-bezier(.16,1,.3,1);
}

@media (prefers-color-scheme: light) {
  :root {
    --bg-deep:#eef1f6; --bg:#f5f7fb; --bg-elevated:#fff; --bg-card:#fff; --bg-card-hover:#fafbff;
    --border-subtle:rgba(0,0,0,.05); --border:rgba(0,0,0,.09); --border-hover:rgba(0,0,0,.14);
    --text:#1a1f2e; --text-secondary:#4a5568; --text-muted:#94a3b8;
    --accent:#2563eb; --accent-glow:rgba(37,99,235,.12);
    --star:#b8860b; --star-glow:rgba(184,134,11,.08); --star-border:rgba(184,134,11,.20);
    --c-ai-bg:rgba(37,99,235,.07); --c-robot-bg:rgba(16,185,129,.07);
    --c-industry-bg:rgba(147,51,234,.07); --c-dev-bg:rgba(6,182,212,.07);
    --c-milpol-bg:rgba(220,38,38,.07); --c-other-bg:rgba(100,116,139,.06);
    --shadow-sm:0 1px 2px rgba(0,0,0,.06);
    --shadow-md:0 4px 16px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.04);
    --shadow-lg:0 8px 32px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.05);
  }
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { font-size:15px; scroll-behavior:smooth; }
body {
  background: var(--bg); color:var(--text); font-family:var(--font-sans);
  line-height:1.6; min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before {
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 80% 60% at 20% -10%, rgba(91,156,246,.06) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 85% 110%, rgba(199,125,255,.05) 0%, transparent 55%);
}
body > * { position:relative; z-index:1; }

@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; }
}
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }

.shell { max-width:1200px; margin:0 auto; padding:36px 28px 72px; }

/* ── HERO HEADER ── */
.hero { margin-bottom:40px; opacity:0; animation:fadeUp .7s var(--ease-out-expo) .05s forwards; }
.hero-top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.hero h1 {
  font-size:1.75rem; font-weight:800; letter-spacing:-.03em; line-height:1.2;
  background:linear-gradient(135deg,var(--text) 0%,var(--text-secondary) 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.hero-badge {
  display:inline-flex; align-items:center; gap:6px; font-size:.72rem; color:var(--text-muted);
  background:var(--bg-elevated); border:1px solid var(--border-subtle); border-radius:999px;
  padding:4px 14px; white-space:nowrap; font-variant-numeric:tabular-nums;
}
.hero-badge::before {
  content:""; width:6px;height:6px; border-radius:50%; background:var(--c-robot);
  box-shadow:0 0 6px var(--c-robot);
}
.hero-sub { margin-top:8px; color:var(--text-muted); font-size:.82rem; }

/* ══════════════════════════════════════════
   STATS GRID — V3 炫酷重设计
   ══════════════════════════════════════════ */
.stats-grid {
  display:grid;
  grid-template-columns: 2fr repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 36px;
}

/* ---- 统一卡片基底 ---- */
.stat-card {
  --card-accent: var(--c-ai);
  --card-glow:  rgba(91,156,246,.18);
  --card-glow-strong: rgba(91,156,246,.35);

  background: var(--bg-card);
  border-radius: var(--r-lg);
  padding: 24px 20px;
  position: relative;
  overflow: hidden;
  cursor: default;

  /* 渐变描边（用伪元素模拟） */
  border: 1px solid transparent;
  background-clip: padding-box;

  /* 内部径向光斑 */
  transition:
    transform .30s var(--ease-out-expo),
    box-shadow .35s ease,
    filter .30s ease;

  opacity: 0;
  animation: fadeUp .6s var(--ease-out-expo) forwards;
}
.stat-card:nth-child(1){ animation-delay:.06s; --card-accent:var(--accent); --card-glow:rgba(91,156,246,.22); --card-glow-strong:rgba(91,156,246,.45); }
.stat-card:nth-child(2){ animation-delay:.12s; --card-accent:var(--c-robot); --card-glow:rgba(61,214,140,.18); --card-glow-strong:rgba(61,214,140,.40); }
.stat-card:nth-child(3){ animation-delay:.18s; --card-accent:var(--c-industry); --card-glow:rgba(199,125,255,.18); --card-glow-strong:rgba(199,125,255,.40); }
.stat-card:nth-child(4){ animation-delay:.24s; --card-accent:var(--c-dev); --card-glow:rgba(56,198,248,.18); --card-glow-strong:rgba(56,198,248,.40); }
.stat-card:nth-child(5){ animation-delay:.30s; --card-accent:var(--c-milpol); --card-glow:rgba(240,107,107,.18); --card-glow-strong:rgba(240,107,107,.40); }

/* 渐变描边伪元素 */
.stat-card::before {
  content:"";
  position:absolute;
  inset:0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(
    135deg,
    var(--card-accent) 0%,
    transparent 45%,
    transparent 70%,
    var(--card-accent) 100%
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events:none;
  opacity: .55;
  transition: opacity .30s ease;
}

/* 内部径向微光晕 */
.stat-card::after {
  content:"";
  position:absolute;
  width: 140%;
  height: 120%;
  top: -30%;
  right: -35%;
  background: radial-gradient(ellipse at center, var(--card-glow) 0%, transparent 70%);
  pointer-events:none;
  opacity: .7;
  transition: opacity .30s ease, transform .35s var(--ease-out-expo);
}

/* hover 动感反馈 */
.stat-card:hover {
  transform: translateY(-4px) scale(1.02);
  box-shadow:
    0 8px 32px var(--card-glow),
    0 0 24px var(--card-glow-strong);
  filter: brightness(1.04);
}
.stat-card:hover::before { opacity: 1; }
.stat-card:hover::after { opacity: 1; transform: scale(1.15) translate(-3%, 2%); }

/* ---- 首卡戏剧化处理（情报总条数） ---- */
.stat-card:first-child {
  grid-row: span 1;
  padding: 28px 24px;
  background:
    radial-gradient(ellipse 100% 80% at 50% 110%, var(--card-glow) 0%, transparent 60%),
    var(--bg-card);
}
.stat-card:first-child::after {
  width: 180%;
  height: 150%;
  top: -40%;
  right: -50%;
  background: radial-gradient(
    ellipse at 60% 80%,
    var(--card-glow-strong) 0%,
    var(--card-glow) 30%,
    transparent 65%
  );
  opacity: .55;
}
.stat-card:first-child::before {
  background: linear-gradient(
    135deg,
    var(--accent) 0%,
    var(--c-industry) 50%,
    var(--accent) 100%
  );
  opacity: .75;
}
.stat-card:first-child:hover::before { opacity: 1; }
.stat-card:first-child:hover::after { opacity: .85; transform: scale(1.1) translate(-2%, 1%); }

/* 首卡左侧发光竖条 */
.stat-card:first-child .stat-accent-bar {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, var(--accent), var(--c-industry));
  border-radius: 2px 0 0 2px;
  box-shadow: 0 0 12px var(--card-glow-strong);
}

/* ---- 数字与标签 ---- */
.stat-val-wrap {
  position: relative;
  display: inline-block;
}
.stat-val {
  font-size: 2.4rem;
  font-weight: 800;
  letter-spacing: -.04em;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  /* 数字文字微辉光 */
  text-shadow: 0 0 20px var(--card-glow);
  transition: text-shadow .30s ease, transform .25s var(--ease-out-expo);
}
.stat-card:first-child .stat-val {
  font-size: 3.4rem;
  letter-spacing: -.05em;
  text-shadow:
    0 0 30px var(--card-glow-strong),
    0 0 60px rgba(91,156,246,.15);
}
.stat-card:hover .stat-val {
  transform: scale(1.05);
  text-shadow: 0 0 28px var(--card-glow-strong);
}
.stat-card:first-child:hover .stat-val {
  text-shadow:
    0 0 40px var(--card-glow-strong),
    0 0 80px rgba(91,156,246,.20);
}

.stat-lbl {
  color: var(--text-muted);
  font-size: .72rem;
  font-weight: 500;
  margin-top: 8px;
  text-transform: uppercase;
  letter-spacing: .06em;
  display: flex;
  align-items: center;
  gap: 6px;
}
.stat-lbl-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--card-accent);
  box-shadow: 0 0 6px var(--card-glow);
  flex-shrink: 0;
}

/* ── FILTER BAR ── */
.filter-row {
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin-bottom:28px; padding-bottom:22px; border-bottom:1px solid var(--border-subtle);
  opacity:0; animation:fadeUp .6s var(--ease-out-expo) .38s forwards;
}
.filter-label {
  color:var(--text-muted); font-size:.72rem; font-weight:600;
  text-transform:uppercase; letter-spacing:.06em; flex-shrink:0;
}
.chip {
  display:inline-flex; align-items:center; gap:6px;
  border:1px solid var(--border-subtle); background:transparent; color:var(--text-secondary);
  border-radius:999px; padding:5px 14px; font-size:.76rem; cursor:pointer;
  user-select:none; transition:all .2s ease; font-weight:500;
}
.chip::before {
  content:""; width:7px;height:7px; border-radius:50%; flex-shrink:0;
}
.chip[data-cat="ai"]::before      {background:var(--c-ai)}
.chip[data-cat="robot"]::before   {background:var(--c-robot)}
.chip[data-cat="industry"]::before{background:var(--c-industry)}
.chip[data-cat="dev"]::before     {background:var(--c-dev)}
.chip[data-cat="milpol"]::before  {background:var(--c-milpol)}
.chip[data-cat="other"]::before   {background:var(--c-other)}
.chip:hover { border-color:var(--border-hover); background:var(--bg-card-hover); }
.chip.active { color:var(--text); border-color:transparent; font-weight:600; }
.chip[data-cat="ai"].active      {background:var(--c-ai-bg);border-color:rgba(91,156,246,.25);color:var(--c-ai)}
.chip[data-cat="robot"].active   {background:var(--c-robot-bg);border-color:rgba(61,214,140,.25);color:var(--c-robot)}
.chip[data-cat="industry"].active{background:var(--c-industry-bg);border-color:rgba(199,125,255,.25);color:var(--c-industry)}
.chip[data-cat="dev"].active     {background:var(--c-dev-bg);border-color:rgba(56,198,248,.25);color:var(--c-dev)}
.chip[data-cat="milpol"].active  {background:var(--c-milpol-bg);border-color:rgba(240,107,107,.25);color:var(--c-milpol)}
.chip[data-cat="other"].active   {background:var(--c-other-bg);border-color:rgba(139,149,168,.20);color:var(--c-other)}
.chip .count { opacity:.6; font-size:.70rem; font-variant-numeric:tabular-nums; }

/* ── TIMELINE ── */
.timeline { opacity:0; animation:fadeUp .6s var(--ease-out-expo) .48s forwards; }

.day-card {
  background:var(--bg-card); border:1px solid var(--border-subtle); border-radius:var(--r-lg);
  margin-bottom:16px; overflow:hidden;
  transition:border-color .25s ease,box-shadow .25s ease;
}
.day-card:hover { border-color:var(--border-hover); box-shadow:var(--shadow-md); }

.day-head {
  display:flex; align-items:center; gap:14px; padding:16px 22px; cursor:pointer;
  user-select:none; transition:background .2s ease; -webkit-tap-highlight-color:transparent;
}
.day-head:hover { background:var(--bg-card-hover); }
.day-head:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; border-radius:var(--r-lg); }

.day-date-block { display:flex; flex-direction:column; min-width:88px; flex-shrink:0; }
.day-date-num { font-size:1.15rem; font-weight:750; letter-spacing:-.02em; line-height:1.2; font-variant-numeric:tabular-nums; }
.day-date-dow { font-size:.72rem; color:var(--text-muted); font-weight:500; }

.day-issue-tag {
  font-size:.68rem; color:var(--text-muted); background:var(--bg-elevated);
  border:1px solid var(--border-subtle); padding:1px 8px; border-radius:999px; font-weight:500; flex-shrink:0;
}
.day-star-icon { color:var(--star); font-size:.85rem; flex-shrink:0; filter:drop-shadow(0 0 4px var(--star-glow)); }

.day-meta { margin-left:auto; display:flex; align-items:center; gap:10px; flex-shrink:0; }
.day-count-txt { color:var(--text-muted); font-size:.76rem; font-variant-numeric:tabular-nums; }
.day-chevron { color:var(--text-muted); font-size:.62rem; transition:transform .25s var(--ease-out-expo); opacity:.5; }
.day-card.expanded .day-chevron { transform:rotate(90deg); opacity:1; }

.day-body { display:none; padding:6px 22px 20px; border-top:1px solid var(--border-subtle); background:rgba(0,0,0,.06); }
.day-card.expanded .day-body { display:block; }

.entry { padding:12px 0 12px 16px; border-bottom:1px dashed var(--border-subtle); position:relative; }
.entry:last-child { border-bottom:none; }
.entry::before {
  content:""; position:absolute; left:0;top:18px; width:4px;height:4px; border-radius:50%;
  background:var(--border); transition:background .2s ease;
}
.entry:hover::before { background:var(--accent); }

.entry-top { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.entry-title { font-weight:650; font-size:.88rem; line-height:1.45; }
.entry-summary { color:var(--text-secondary); font-size:.82rem; margin-top:5px; line-height:1.6; }
.entry-url {
  font-size:.74rem; margin-top:6px; display:inline-block; word-break:break-all;
  color:var(--text-muted); transition:color .15s ease;
}
.entry-url:hover { color:var(--accent); text-decoration:none; }

.tag {
  display:inline-flex; align-items:center; font-size:.67rem; font-weight:700;
  border-radius:4px; padding:2px 9px; vertical-align:middle;
  letter-spacing:.03em; text-transform:uppercase; flex-shrink:0; border:1px solid transparent;
}
.tag.ai      {color:var(--c-ai);background:var(--c-ai-bg);border-color:rgba(91,156,246,.15)}
.tag.robot   {color:var(--c-robot);background:var(--c-robot-bg);border-color:rgba(61,214,140,.15)}
.tag.industry{color:var(--c-industry);background:var(--c-industry-bg);border-color:rgba(199,125,255,.15)}
.tag.dev     {color:var(--c-dev);background:var(--c-dev-bg);border-color:rgba(56,198,248,.15)}
.tag.milpol  {color:var(--c-milpol);background:var(--c-milpol-bg);border-color:rgba(240,107,107,.15)}
.tag.other   {color:var(--c-other);background:var(--c-other-bg);border-color:rgba(139,149,168,.12)}

.focus-block {
  margin-top:16px; background:var(--star-glow); border:1px solid var(--star-border);
  border-radius:var(--r-md); padding:14px 18px; font-size:.85rem; line-height:1.65;
  color:var(--text-secondary); position:relative;
}
.focus-block strong { color:var(--star); font-weight:700; }
.focus-block::before {
  content:""; position:absolute; left:0;top:0;bottom:0; width:3px;
  background:linear-gradient(180deg,var(--star),transparent); border-radius:2px 0 0 2px;
}

.loading,.empty-state { color:var(--text-muted); text-align:center; padding:64px 0; font-size:.88rem; }

@keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

@media (max-width:960px) {
  .stats-grid { grid-template-columns:repeat(3,1fr); }
  .stat-card:first-child .stat-val { font-size:2.4rem; }
  .stat-card:first-child { grid-column: span 3; }
}
@media (max-width:640px) {
  .shell { padding:20px 14px 48px; }
  .stats-grid { grid-template-columns:repeat(2,1fr); gap:10px; }
  .stat-card { padding:16px 14px; } .stat-val { font-size:1.8rem; }
  .stat-card:first-child .stat-val { font-size:2.2rem; }
  .hero h1 { font-size:1.35rem; }
  .day-head { padding:12px 14px; } .day-body { padding:4px 14px 16px; }
}
</style>
</head>
<body>

<div class="shell">

<header class="hero">
  <div class="hero-top">
    <div>
      <h1>科技情报观测站</h1>
      <div class="hero-sub">tech-intel · 情报聚合与追踪</div>
    </div>
    <div class="hero-badge" id="gen-at">加载中…</div>
  </div>
</header>

<section class="stats-grid" id="stats"></section>

<nav class="filter-row" id="catbar"></nav>

<main id="list"><div class="loading">加载中…</div></main>

</div>

<script>
let IDX = null, MONTH_CACHE = {}, activeCat = null;

const CAT_LABEL = {
  ai:'AI/大模型', robot:'机器人', industry:'科技行业',
  dev:'开源/开发', milpol:'军事/政策/商业', other:'其他'
};
const CAT_ORDER = ['ai','robot','industry','dev','milpol','other'];

function esc(s) {
  return (s||'').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

async function j(url) { const r=await fetch(url); if(!r.ok) throw new Error(url); return r.json(); }

async function loadMonth(m) {
  if(!MONTH_CACHE[m]) MONTH_CACHE[m]=await j('data/monthly/'+m+'.json');
  return MONTH_CACHE[m];
}
async function loadAllMonths() { for(const m of IDX.months) await loadMonth(m); }

/* ══════════════════════════════════════════
   COUNT-UP 动画引擎（V3 新增）
   缓动：easeOutExpo；reduced-motion 下直接显示终值
   ══════════════════════════════════════════ */
const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function countUp(el, target, duration) {
  if (REDUCED_MOTION || duration <= 0) { el.textContent = target; return; }
  const start = performance.now();
  function tick(now) {
    const p = Math.min((now - start) / duration, 1);
    // easeOutExpo
    const eased = p === 1 ? 1 : 1 - Math.pow(2, -10 * p);
    el.textContent = String(Math.round(eased * target));
    if (p < 1) requestAnimationFrame(tick);
    else el.textContent = target;
  }
  requestAnimationFrame(tick);
}

/* 统计卡配置（V3：每张卡独立 accent 色系） */
const STAT_ITEMS = [
  { key: 'entries', label: '情报总条数', hero: true },
  { key: 'days',    label: '覆盖天数',   hero: false },
  { key: 'last7',   label: '近7天',      hero: false },
  { key: 'last30',  label: '近30天',     hero: false },
  { key: 'focus',   label: '⭐ 点评数',  hero: false },
];

function renderStats() {
  var t = IDX.totals;
  document.getElementById('gen-at').textContent =
    new Date(IDX.generatedAt).toLocaleString('zh-CN',{hour12:false}) +
    ' · 数据源 tech-intel/memory/intel';

  /* 渲染 5 张统计卡（移除专题报告） */
  document.getElementById('stats').innerHTML = STAT_ITEMS.map(function(item, idx) {
    var val = t[item.key];
    var barHtml = item.hero ? '<div class="stat-accent-bar"></div>' : '';
    return '<div class="stat-card">' + barHtml +
      '<div class="stat-val-wrap"><span class="stat-val" data-target="' + val + '" data-duration="' + (item.hero ? 1600 : 1200) + '">0</span></div>' +
      '<div class="stat-lbl"><span class="stat-lbl-dot"></span>' + item.label + '</div>' +
      '</div>';
  }).join('');

  /* 启动 count-up 动画 */
  var valEls = document.querySelectorAll('.stat-val[data-target]');
  for (var vi = 0; vi < valEls.length; vi++) (function(el){
    var target = parseInt(el.dataset.target, 10);
    var dur = parseInt(el.dataset.duration, 10) || 1200;
    // 延迟到入场动画差不多完成后开始滚动数字
    setTimeout(function(){ countUp(el, target, dur); }, 400 + vi * 100);
  })(valEls[vi]);

  /* 筛选栏（不变） */
  var chipsHtml = CAT_ORDER.filter(function(c){return IDX.byCategory[c]}).map(function(c){
    var n=IDX.byCategory[c], pct=Math.round(n/t.entries*100);
    return '<button class="chip" data-cat="'+c+'">'+CAT_LABEL[c]+'<span class="count">'+n+' · '+pct+'%</span></button>';
  }).join('');

  document.getElementById('catbar').innerHTML='<span class="filter-label">分类筛选</span>'+chipsHtml;

  var chips=document.getElementById('catbar').querySelectorAll('.chip');
  for(var i=0;i<chips.length;i++)(function(ch){ch.addEventListener('click',function(){toggleCat(ch.dataset.cat)})})(chips[i]);
}

function toggleCat(c) {
  activeCat=(activeCat===c)?null:c;
  var chips=document.getElementById('catbar').querySelectorAll('.chip');
  for(var i=0;i<chips.length;i++) chips[i].classList.toggle('active',chips[i].dataset.cat===activeCat);
  renderList();
}

function entryHtml(e) {
  if(activeCat && e.category!==activeCat) return '';
  return '<div class="entry"><div class="entry-top">'+
    '<span class="tag '+e.category+'">'+(CAT_LABEL[e.category]||e.category)+'</span>'+
    '<span class="entry-title">'+esc(e.title)+'</span></div>'+
    (e.summary?'<div class="entry-summary">'+esc(e.summary)+'</div>':'')+
    '<a class="entry-url" href="'+esc(e.url)+'" target="_blank" rel="noopener noreferrer">'+esc(shortUrl(e.url))+' ↗</a>'+
    '</div>';
}

function shortUrl(u) { try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u} }

async function renderList() {
  var el=document.getElementById('list');
  if(activeCat) await loadAllMonths();
  var months=activeCat?IDX.months:[IDX.months[IDX.months.length-1]].filter(Boolean);
  var html='';

  for(var mi=0;mi<months.length;mi++){
    var data=await loadMonth(months[mi]);
    for(var di=0;di<data.days.length;di++){
      var d=data.days[di];
      if(activeCat&&!d.entries.some(function(e){return e.category===activeCat})) continue;
      var entries=d.entries.map(entryHtml).join('');
      html+='<div class="day-card" data-date="'+d.date+'">'+
        '<div class="day-head" tabindex="0" role="button" aria-expanded="false">'+
          '<div class="day-date-block">'+
            '<span class="day-date-num">'+d.date.slice(5)+'</span>'+
            '<span class="day-date-dow">'+esc(d.weekday)+'</span>'+
          '</div>'+
          (d.issue>1?'<span class="day-issue-tag">增刊×'+d.issue+'</span>':'')+
          (d.hasFocus?'<span class="day-star-icon">★</span>':'')+
          '<div class="day-meta">'+
            '<span class="day-count-txt">'+d.entries.length+' 条</span>'+
            '<span class="day-chevron">▶</span>'+
          '</div>'+
        '</div>'+
        '<div class="day-body">'+entries+
          (d.focus?'<div class="focus-block"><strong>★ 值得关注</strong>&emsp;'+esc(d.focus)+'</div>':'')+
        '</div></div>';
    }
  }

  el.innerHTML=html||'<div class="empty-state">无匹配条目</div>';

  var headers=el.querySelectorAll('.day-head');
  for(var hi=0;hi<headers.length;hi++)(function(h){
    var toggle=function(){
      var dayEl=h.parentElement,isExp=dayEl.classList.toggle('expanded');
      h.setAttribute('aria-expanded',String(isExp));
    };
    h.addEventListener('click',toggle);
    h.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
  })(headers[hi]);
}

/* 注意：renderInsights() 已在 V3 中彻底移除 */

(async function(){
  try{
    IDX=await j('data/index.json');
    renderStats(); renderList();
  }catch(e){
    document.getElementById('list').innerHTML=
      '<div class="empty-state">数据加载失败：'+esc(e.message)+'（请先运行 gen-intel-dashboard.mjs）</div>';
  }
})();
</script>
